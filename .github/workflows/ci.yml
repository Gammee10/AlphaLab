name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Purity gate (core has no I/O, web, ORM, HTTP, or AI imports)
        run: python -m pytest backend/tests/test_purity.py -q
        working-directory: .
      - name: Backend tests
        run: python -m pytest backend/tests -q
      - name: Typecheck
        run: python -m mypy alphalab_contracts alphalab_core alphalab_marketdata
        working-directory: backend
